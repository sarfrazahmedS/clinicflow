# Render blueprint — deploys ClinicFlow as one Docker web service.
# Bring your own PostgreSQL (e.g. a free Neon database) and paste its
# connection string into the DATABASE_URL env var when prompted.
services:
  - type: web
    name: clinicflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
